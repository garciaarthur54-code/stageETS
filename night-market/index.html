<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Night Market Tycoon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout : plein écran portrait — scène 3D (Three.js) + étiquettes projetées + HUD flottant */
:root {
  --night: #12172e;
  --panel: #1d2346;
  --ink: #fff4e0;
  --muted: #a7add4;
  --lantern: #ff7a3d;
  --gold: #ffcc48;
  --jade: #38d39f;
  --font-ui: "Baloo 2", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--night); color: var(--ink); font-family: var(--font-ui);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { pointer-events: none; z-index: 1; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }

.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; line-height: 1.1; text-align: center; will-change: transform; }
.lbl.st { font-size: 12px; color: var(--ink); background: rgba(10, 13, 30, .7); border-radius: 8px; padding: 3px 7px 1px; }
.lbl.st i { display: block; width: 44px; height: 4px; margin: 2px auto 1px; background: rgba(255, 255, 255, .18); border-radius: 2px; overflow: hidden; }
.lbl.st s { display: block; height: 100%; background: var(--gold); text-decoration: none; }
.lbl.tile { display: flex; flex-direction: column; align-items: center; color: var(--ink); opacity: .7; }
.lbl.tile .e { font-size: 22px; }
.lbl.tile b { font-size: 14px; color: var(--gold); text-shadow: 0 1px 3px #000; }
.lbl.tile small { font-size: 11px; text-shadow: 0 1px 3px #000; }
.lbl.tile.afford { opacity: 1; }
.lbl.order { display: flex; gap: 6px; align-items: center; background: var(--ink); color: #2a1405; border-radius: 10px; padding: 3px 8px 1px; font-size: 13px; box-shadow: 0 3px 8px rgba(0, 0, 0, .35); }
.lbl.cash { font-size: 15px; color: var(--gold); text-shadow: 0 1px 3px #000; }
.lbl.lock { font-size: 20px; opacity: .8; }
.lbl.full { font-size: 11px; color: var(--gold); text-shadow: 0 1px 3px #000; }
.lbl.float { font-size: 18px; color: var(--gold); text-shadow: 0 2px 4px rgba(0, 0, 0, .8); }

.hud { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding-inline: 12px; pointer-events: none; z-index: 2; }
.hud > * { pointer-events: auto; }
#hud-top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
#hud-bottom { bottom: 0; justify-content: center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }

.pill { display: flex; align-items: center; gap: 6px; background: rgba(10, 13, 30, .72); border: 1px solid rgba(255, 204, 72, .25); border-radius: 999px; padding: 4px 14px 2px; font-weight: 800; line-height: 1.2; backdrop-filter: blur(6px); }
.money { font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; min-width: 0; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2a8, var(--gold) 55%, #c98a12); box-shadow: 0 0 10px rgba(255, 204, 72, .6); flex: none; margin-top: -2px; }
.city { font-size: 15px; color: var(--ink); margin-left: auto; }
.city small { color: var(--jade); font-size: 13px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .15); background: rgba(10, 13, 30, .72); color: var(--ink); font-size: 18px; cursor: pointer; }

.big-btn { font-family: var(--font-ui); font-weight: 800; font-size: 18px; color: #2a1405; background: linear-gradient(#ffd56a, #ff9a3d); border: 0; border-radius: 16px; padding: 10px 22px 7px; box-shadow: 0 4px 0 #b4561a, 0 8px 18px rgba(0, 0, 0, .35); cursor: pointer; }
.big-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b4561a; }
.big-btn.alt { background: linear-gradient(#7ff0c6, var(--jade)); box-shadow: 0 4px 0 #1b8a63, 0 8px 18px rgba(0, 0, 0, .35); color: #062a1d; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; max-height: 62%; display: flex; flex-direction: column; background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .5); padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); max-width: 520px; margin-inline: auto; }
#sheet header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#sheet h2 { margin: 0; font-size: 22px; }
#sheet .stats { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
#up-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
.up-row { display: flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, .05); border-radius: 14px; padding: 8px 10px; }
.up-ic { font-size: 28px; width: 36px; text-align: center; flex: none; }
.up-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.up-txt b { font-size: 16px; }
.up-txt span { font-size: 13px; color: var(--muted); }
.buy { font-family: var(--font-ui); font-weight: 800; font-size: 15px; border: 0; border-radius: 12px; padding: 7px 12px 4px; background: var(--gold); color: #2a1405; cursor: pointer; flex: none; font-variant-numeric: tabular-nums; }
.buy:disabled { background: rgba(255, 255, 255, .12); color: var(--muted); cursor: default; }
.maxed { color: var(--jade); font-weight: 800; padding-inline: 10px; }

#modal { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(5, 7, 18, .6); padding-inline: 16px; }
#modal .card { background: var(--panel); border: 1px solid rgba(255, 204, 72, .3); border-radius: 22px; padding: 20px; max-width: 360px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
#modal h2 { margin: 0 0 6px; font-size: 24px; text-wrap: balance; }
#modal p { margin: 0 0 16px; color: var(--muted); line-height: 1.45; }
#modal .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#modal-cancel { background: rgba(255, 255, 255, .12); color: var(--ink); box-shadow: none; }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); z-index: 5; background: rgba(10, 13, 30, .85); border: 1px solid rgba(56, 211, 159, .5); color: var(--ink); font-weight: 700; padding: 6px 16px 3px; border-radius: 999px; white-space: nowrap; transition: opacity .3s; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Le marché de nuit en 3D"></canvas>
<div id="labels"></div>
<canvas id="fx"></canvas>

<div id="hud-top" class="hud">
  <div class="pill money"><span class="coin" id="coin-icon"></span><span id="money">0</span></div>
  <div class="pill city"><span id="city">Taipei</span>&nbsp;<small id="mult">×1</small></div>
  <button id="mute" class="icon-btn" aria-label="Couper le son">🔊</button>
</div>

<div id="hud-bottom" class="hud">
  <button id="btn-upgrades" class="big-btn">⬆️ Améliorer</button>
  <button id="btn-prestige" class="big-btn alt" hidden>🏮 Déménager</button>
</div>

<div id="sheet" hidden>
  <header><h2>Améliorations</h2><button id="sheet-close" class="icon-btn" aria-label="Fermer">✕</button></header>
  <p class="stats" id="stats"></p>
  <div id="up-list"></div>
</div>

<div id="modal" hidden>
  <div class="card">
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div class="row">
      <button id="modal-cancel" class="big-btn" hidden>Annuler</button>
      <button id="modal-ok" class="big-btn">OK</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

if (!window.THREE) {
  document.getElementById('modal-title').textContent = 'Chargement impossible';
  document.getElementById('modal-text').textContent = "Le moteur 3D n'a pas pu se charger. Vérifie ta connexion puis recharge la page.";
  document.getElementById('modal').hidden = false;
  return;
}

// ---------------------------------------------------------------------------
// Données de jeu (la logique travaille sur un plan 2D de 400 × 720 unités)
// ---------------------------------------------------------------------------
const W = 400, H = 720;
const PICK_Y = 205;
const COUNTER = { x1: 40, x2: 300, y: 380, h: 28 };
const DROP_Y = 360;
const QUEUE_X = 170, QUEUE_Y = 440, QUEUE_GAP = 38, QUEUE_MAX = 7;
const CASH = { x: 352, y: 395 };
const SAVE_KEY = 'nightmarket.v1';

const STATIONS = [
  { name: 'Brochettes', emoji: '🍢', price: 4,  cook: 1.5, unlock: 0,    up: 15,   color: '#ff5a5f', x: 65 },
  { name: 'Ramen',      emoji: '🍜', price: 11, cook: 2.2, unlock: 120,  up: 90,   color: '#ffb347', x: 155 },
  { name: 'Bubble tea', emoji: '🧋', price: 28, cook: 2.8, unlock: 800,  up: 500,  color: '#38d39f', x: 245 },
  { name: 'Takoyaki',   emoji: '🐙', price: 70, cook: 3.5, unlock: 4500, up: 2800, color: '#9b84ff', x: 335 },
];
const CITIES = [
  { name: 'Taipei', hue: 232 }, { name: 'Bangkok', hue: 275 }, { name: 'Séoul', hue: 205 },
  { name: 'Osaka', hue: 320 }, { name: 'Marseille', hue: 215 }, { name: 'Mexico', hue: 295 },
  { name: 'Istanbul', hue: 250 }, { name: 'Lagos', hue: 190 },
];
const WORKER_COST = [250, 1500, 9000];
const CASHIER_COST = 500;
const MAX_ST_LV = 25, MAX_SPEED_LV = 8, MAX_CAP_LV = 8;
const SKINS = ['#f2c9a0', '#d9a273', '#a86b43', '#7a4a2a', '#ffd9b8'];
const SHIRTS = ['#4fa3ff', '#ff6f91', '#ffd166', '#06d6a0', '#c792ea', '#f78c6b', '#9bf6ff'];

const stPrice = i => STATIONS[i].price * (1 + 0.3 * (S.st[i].lv - 1)) * S.mult;
const stCook = i => Math.max(0.35, STATIONS[i].cook * Math.pow(0.9, S.st[i].lv - 1));
const stMax = i => 5 + Math.floor(S.st[i].lv / 2);
const stUpCost = i => Math.round(STATIONS[i].up * Math.pow(1.5, S.st[i].lv - 1));
const speedCost = () => Math.round(40 * Math.pow(2, S.lv.speed));
const capCost = () => Math.round(60 * Math.pow(2.3, S.lv.cap));
const playerSpeed = () => 150 + 18 * S.lv.speed;
const capacity = () => 3 + S.lv.cap;
const prestigeCost = () => Math.round(15000 * Math.pow(3, S.city));
const cityName = c => CITIES[c % CITIES.length].name + (c >= CITIES.length ? ' ' + (Math.floor(c / CITIES.length) + 1) : '');
const unlockedCount = () => S.st.filter(s => s.u).length;

function freshState(keep = {}) {
  return {
    money: 0, total: 0,
    city: keep.city ?? 0, mult: keep.mult ?? 1,
    served: keep.served ?? 0, vip: keep.vip ?? 0, seenIntro: keep.seenIntro ?? false,
    st: STATIONS.map((_, i) => ({ u: i === 0, lv: 1, stock: i === 0 ? 2 : 0 })),
    lv: { speed: 0, cap: 0 },
    workers: 0, cashier: false,
    tile: {}, cash: 0, counter: {},
    t: Date.now(),
  };
}
let S = freshState();

// ---------------------------------------------------------------------------
// Sauvegarde (localStorage peut être indisponible : on joue quand même)
// ---------------------------------------------------------------------------
function save() {
  S.t = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* stockage indisponible */ }
}
function load(data) {
  let raw = data;
  if (!raw) { try { raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { raw = null; } }
  if (!raw || !Array.isArray(raw.st)) return false;
  const base = freshState();
  S = Object.assign(base, raw);
  S.st = base.st.map((d, i) => Object.assign(d, raw.st[i] || {}));
  S.lv = Object.assign({ speed: 0, cap: 0 }, raw.lv || {});
  return true;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, x, y) => Math.hypot(a - x, b - y);
function fmt(n) {
  if (n < 1000) return n < 10 && n % 1 > 0.05 ? n.toFixed(1) : String(Math.floor(n));
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
}

// ---------------------------------------------------------------------------
// Scène 3D
// ---------------------------------------------------------------------------
const toX = x => (x - 200) / 20, toZ = y => (y - 360) / 20;   // 20 unités logiques = 1 mètre
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOV = 32, TILT = 52 * Math.PI / 180;
const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 400);
const camTarget = new THREE.Vector3(0, 0, 1);
let viewW = 0, viewH = 0, camD = 40;

const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
let dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = window.innerWidth; viewH = window.innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(viewW, viewH, false);
  fx.width = Math.round(viewW * dpr); fx.height = Math.round(viewH * dpr);
  camera.aspect = viewW / viewH; camera.updateProjectionMatrix();
  const t = Math.tan(FOV / 2 * Math.PI / 180);
  camD = Math.max(15 / (2 * t * camera.aspect), 24 * Math.sin(TILT) / (2 * t));
}
window.addEventListener('resize', resize);
resize();

// Matériaux & géométries partagés
const matCache = {};
function mat(color, opts) {
  const k = color + (opts ? JSON.stringify(opts) : '');
  return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color }, opts)));
}
const basic = color => matCache['b' + color] || (matCache['b' + color] = new THREE.MeshBasicMaterial({ color }));
function mesh(geo, material, shadow = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
const GEO = {
  body: new THREE.CylinderGeometry(0.34, 0.42, 0.9, 14),
  head: new THREE.SphereGeometry(0.36, 18, 14),
  eye: new THREE.SphereGeometry(0.055, 8, 6),
  leg: new THREE.BoxGeometry(0.2, 0.5, 0.22),
  hatBase: new THREE.CylinderGeometry(0.3, 0.3, 0.22, 14),
  hatTop: new THREE.SphereGeometry(0.36, 14, 10),
  band: new THREE.CylinderGeometry(0.37, 0.37, 0.1, 14),
  crown: new THREE.ConeGeometry(0.22, 0.3, 5),
  halo: new THREE.RingGeometry(0.55, 0.75, 24),
  coin: new THREE.CylinderGeometry(0.22, 0.22, 0.08, 14),
  arrow: new THREE.ConeGeometry(0.4, 0.8, 4),
  arrowStem: new THREE.BoxGeometry(0.22, 0.6, 0.22),
};

function canvasTex(w, h, paint) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}
const emojiTexCache = {};
function emojiSprite(e, size) {
  const tex = emojiTexCache[e] || (emojiTexCache[e] = canvasTex(128, 128, (g) => {
    g.font = '100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 64, 72);
  }));
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  s.scale.set(size, size, 1);
  return s;
}

// --- Plats en 3D -----------------------------------------------------------
const FOOD_H = [0.18, 0.26, 0.5, 0.2];
const FG = {
  stick: new THREE.CylinderGeometry(0.025, 0.025, 0.9, 5),
  ball: new THREE.SphereGeometry(0.11, 10, 8),
  bowl: new THREE.CylinderGeometry(0.34, 0.22, 0.24, 16),
  broth: new THREE.CylinderGeometry(0.31, 0.31, 0.02, 16),
  egg: new THREE.SphereGeometry(0.09, 10, 8),
  cup: new THREE.CylinderGeometry(0.17, 0.13, 0.46, 14),
  lid: new THREE.CylinderGeometry(0.18, 0.18, 0.04, 14),
  straw: new THREE.CylinderGeometry(0.025, 0.025, 0.32, 6),
  tray: new THREE.BoxGeometry(0.56, 0.06, 0.32),
  tako: new THREE.SphereGeometry(0.1, 10, 8),
};
function makeFood(i) {
  const g = new THREE.Group();
  const add = (geo, color, x, y, z) => { const m = mesh(geo, mat(color), false); m.position.set(x, y, z); g.add(m); return m; };
  if (i === 0) {
    add(FG.stick, '#c8a165', 0, 0.09, 0).rotation.z = Math.PI / 2;
    add(FG.ball, '#8b4a2b', -0.22, 0.09, 0); add(FG.ball, '#f4e3c1', 0, 0.09, 0); add(FG.ball, '#e86a6a', 0.22, 0.09, 0);
  } else if (i === 1) {
    add(FG.bowl, '#d64545', 0, 0.12, 0); add(FG.broth, '#f2c78a', 0, 0.235, 0);
    add(FG.egg, '#fff6e0', 0.1, 0.25, 0.05).scale.set(1, 0.5, 1);
  } else if (i === 2) {
    add(FG.cup, '#e8c9a0', 0, 0.23, 0); add(FG.lid, '#ffffff', 0, 0.47, 0);
    add(FG.straw, '#ff6f91', 0.05, 0.6, 0);
  } else {
    add(FG.tray, '#d9b26f', 0, 0.03, 0);
    [-0.17, 0, 0.17].forEach(x => add(FG.tako, '#c9702f', x, 0.13, 0));
  }
  return g;
}
// Aligne une pile de plats 3D sur une liste de types
function syncStack(holder, types, maxN = 99) {
  const items = holder.userData.items || (holder.userData.items = []);
  const n = Math.min(types.length, maxN);
  let y = 0;
  for (let k = 0; k < n; k++) {
    const t = +types[k];
    if (!items[k] || items[k].userData.type !== t) {
      if (items[k]) holder.remove(items[k]);
      items[k] = makeFood(t); items[k].userData.type = t; items[k].rotation.y = (k % 2) * 0.5 - 0.25;
      holder.add(items[k]);
    }
    items[k].position.y = y; y += FOOD_H[t];
  }
  while (items.length > n) holder.remove(items.pop());
}

// --- Décor -----------------------------------------------------------------
const hemi = new THREE.HemisphereLight('#6b78c9', '#2a1a2e', 0.75);
scene.add(hemi);
const moon = new THREE.DirectionalLight('#b8c6ff', 0.55);
moon.position.set(-8, 24, 12); moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
Object.assign(moon.shadow.camera, { left: -16, right: 16, top: 22, bottom: -22, near: 1, far: 60 });
moon.shadow.bias = -0.002;
scene.add(moon); scene.add(moon.target);

const planks = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#6e4a33'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) {
    g.fillStyle = y / 32 % 2 ? '#734e36' : '#694631'; g.fillRect(0, y, w, 30);
    g.fillStyle = '#4b3122'; g.fillRect(0, y + 30, w, 2);
    g.fillRect((y * 37) % w, y, 2, 30);
  }
});
planks.wrapS = planks.wrapT = THREE.RepeatWrapping; planks.repeat.set(4, 3.5);
const cobble = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#2c2f45'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) for (let x = (y / 32 % 2) * 16 - 16; x < w; x += 32) {
    g.fillStyle = `hsl(${230 + Math.random() * 20} 14% ${22 + Math.random() * 6}%)`;
    g.beginPath(); g.roundRect ? g.roundRect(x + 2, y + 2, 28, 28, 6) : g.rect(x + 2, y + 2, 28, 28); g.fill();
  }
});
cobble.wrapS = cobble.wrapT = THREE.RepeatWrapping; cobble.repeat.set(12, 10);

const floor = mesh(new THREE.PlaneGeometry(80, 70), new THREE.MeshLambertMaterial({ map: cobble }), false);
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 14); scene.add(floor);
const deck = mesh(new THREE.BoxGeometry(21, 0.16, 18), [mat('#4b3122'), mat('#4b3122'), new THREE.MeshLambertMaterial({ map: planks }), mat('#4b3122'), mat('#4b3122'), mat('#4b3122')], false);
deck.position.set(0, 0.08, toZ(60) + 9 - 0.5); scene.add(deck);

// Immeubles du fond, fenêtres allumées
const windowsTex = canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  for (let y = 6; y < h - 6; y += 14) for (let x = 6; x < w - 6; x += 14) {
    if (Math.random() < 0.45) { g.fillStyle = Math.random() < 0.5 ? '#ffcf7a' : '#ff9a6a'; g.fillRect(x, y, 8, 9); }
  }
});
const buildings = new THREE.Group();
for (let k = 0; k < 11; k++) {
  const w = 3 + Math.random() * 3, h = 6 + Math.random() * 10, d = 3;
  const tex = windowsTex.clone(); tex.needsUpdate = true; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(w / 3, h / 6);
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: '#1b1f38', emissive: '#ffffff', emissiveMap: tex, emissiveIntensity: 0.6 }));

// Place un personnage selon sa position logique et anime la marche
function poseActor(o, dt, faceCamera) {
  const m = o.mesh, X = toX(o.x), Z = toZ(o.y);
  const dx = X - m.position.x, dz = Z - m.position.z, moving = Math.hypot(dx, dz) > 0.002;
  m.position.set(X, 0.16, Z);
  const u = m.userData;
  let target = u.yaw;
  if (moving) target = Math.atan2(dx, dz);
  else if (faceCamera) target = 0;
  let diff = target - u.yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  u.yaw += diff * Math.min(1, dt * 12);
  u.inner.rotation.y = u.yaw;
  const swing = moving ? Math.sin(o.walk) * 0.7 : 0;
  u.legs[0].rotation.x += (swing - u.legs[0].rotation.x) * 0.4;
  u.legs[1].rotation.x += (-swing - u.legs[1].rotation.x) * 0.4;
  u.inner.position.y = moving ? Math.abs(Math.sin(o.walk)) * 0.08 : 0;
}

  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});

function inputDir() {
  let dx = 0, dy = 0;
  if (joy.id !== null) {
    const vx = joy.x - joy.ox, vy = joy.y - joy.oy, l = Math.hypot(vx, vy);
    if (l > 6) { const k = Math.min(l, 50) / 50 / l; dx = vx * k; dy = vy * k; }
  }
  if (keys.has('arrowleft') || keys.has('a') || keys.has('q')) dx -= 1;
  if (keys.has('arrowright') || keys.has('d')) dx += 1;
  if (keys.has('arrowup') || keys.has('w') || keys.has('z')) dy -= 1;
  if (keys.has('arrowdown') || keys.has('s')) dy += 1;
  const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  return { dx, dy };
}

function queued() { return customers.filter(c => c.state === 'queue'); }
function demandFor(i) {
  let d = 0;
  for (const c of queued()) d += c.order[i] || 0;
  return d - (S.counter[i] || 0);
}
function inDropZone(x, y) { return x > COUNTER.x1 - 10 && x < COUNTER.x2 + 10 && y > COUNTER.y - 55 && y < COUNTER.y + 6; }

function update(dt) {
  time += dt;

  S.st.forEach((st, i) => {
    if (!st.u) return;
    if (st.stock < stMax(i)) {
      st.cookT = (st.cookT || 0) + dt;
      if (st.cookT >= stCook(i)) { st.cookT = 0; st.stock++; }
    } else st.cookT = 0;
  });

  const { dx, dy } = inputDir();
  const moving = dx !== 0 || dy !== 0;
  if (moving) {
    player.x = clamp(player.x + dx * playerSpeed() * dt, 16, W - 16);
    player.y = clamp(player.y + dy * playerSpeed() * dt, 70, H - 16);
    player.walk += dt * 12; idleT = 0;
  } else idleT += dt;

  player.t -= dt;
  if (player.t <= 0) {
    S.st.forEach((st, i) => {
      if (player.t > 0 || !st.u) return;
      if (dist(player.x, player.y, STATIONS[i].x, PICK_Y) < 38 && st.stock >= 1 && player.carry.length < capacity()) {
        st.stock--; player.carry.push(i); player.t = 0.11; sfx.pick();
      }
    });
    if (player.t <= 0 && player.carry.length && inDropZone(player.x, player.y)) {
      const i = player.carry.pop(); S.counter[i] = (S.counter[i] || 0) + 1; player.t = 0.07; sfx.drop();
    }
  }

  if (!S.cashier && S.cash > 0 && dist(player.x, player.y, CASH.x, CASH.y) < 42) {
    earn(S.cash, CASH.x, CASH.y); S.cash = 0; buzz(10);
  }

  for (const tile of TILES) {
    if (!tile.visible()) continue;
    const cost = tile.cost(), paid = S.tile[tile.key] || 0;
    if (Math.abs(player.x - tile.x) < 30 && Math.abs(player.y - tile.y) < 30 && S.money > 0 && !moving) {
      const pay = Math.min(Math.max(cost * 1.4, 40) * dt, S.money, cost - paid);
      S.money -= pay; S.tile[tile.key] = paid + pay;
      tile.tickT = (tile.tickT || 0) - dt;
      if (tile.tickT <= 0) { sfx.tick(); tile.tickT = 0.07; }
      if (S.tile[tile.key] >= cost - 0.001) {
        delete S.tile[tile.key]; tile.done(); sfx.unlock(); buzz(40);
        float('Débloqué !', tile.x, tile.y, 2, '#38d39f');
        save();
      }
    }
  }

  for (const w of workers) updateWorker(w, dt);

  spawnT -= dt;
  if (spawnT <= 0) {
    if (queued().length < QUEUE_MAX) spawnCustomer();
    spawnT = Math.max(0.9, 3.2 - 0.45 * unlockedCount()) * (0.7 + Math.random() * 0.6);
  }
  const q = queued();
  q.forEach((c, k) => { moveTo(c, QUEUE_X, QUEUE_Y + k * QUEUE_GAP, 150, dt); });
  const front = q[0];
  if (front && dist(front.x, front.y, QUEUE_X, QUEUE_Y) < 3) {
    front.t -= dt;
    if (front.t <= 0) {
      const need = Object.keys(front.order).find(i => front.order[i] > 0 && (S.counter[i] || 0) > 0);
      if (need !== undefined) {
        S.counter[need]--; front.order[need]--; front.paid = (front.paid || 0) + stPrice(+need); front.t = 0.14;
      }
      if (Object.values(front.order).every(v => v <= 0)) serve(front);
    }
  }
  for (const c of customers) if (c.state === 'leave') moveTo(c, 300, H + 140, 150, dt);
  customers = customers.filter(c => {
    if (c.state === 'queue' || c.y < H + 120) return true;
    scene.remove(c.mesh); return false;
  });

  floaters = floaters.filter(f => {
    f.t += dt; f.h += dt * 1.3;
    if (f.t < 1.1) return true;
    f.el.remove(); return false;
  });
  coins.forEach(c => { c.t += dt * 2.2; });
  coins = coins.filter(c => c.t < 1);
}

function serve(c) {
  const amount = (c.paid || 0) * (c.vip ? 5 : 1);
  c.state = 'leave';
  S.served++;
  float('😋', c.x, c.y, 2.6);
  if (c.vip) { S.vip++; sfx.vip(); float('Client VIP ×5 !', c.x, c.y, 3.2); }
  if (S.cashier) earn(amount, CASH.x, CASH.y);
  else { S.cash += amount; S.total += amount; float('+' + fmt(amount), CASH.x, CASH.y, 1.8, '#fff4e0'); }
}

function updateWorker(w, dt) {
  const spd = 105;
  w.t -= dt;
  if (w.mode === 'pick') {
    const st = S.st[w.station];
    if (moveTo(w, STATIONS[w.station].x + 12, PICK_Y + 22, spd, dt) && w.t <= 0) {
      if (st.stock >= 1 && w.carry.length < 3) { st.stock--; w.carry.push(w.station); w.t = 0.2; }
      else if (w.carry.length) w.mode = 'drop';
      else w.mode = 'idle';
    }
  } else if (w.mode === 'drop') {
    if (moveTo(w, clamp(STATIONS[w.carry[0]].x, 60, 280), DROP_Y, spd, dt) && w.t <= 0) {
      const i = w.carry.pop(); S.counter[i] = (S.counter[i] || 0) + 1; w.t = 0.12;
      if (!w.carry.length) w.mode = 'idle';
    }
  } else if (w.t <= 0) {
    let best = -1, score = -Infinity;
    S.st.forEach((st, i) => {
      if (!st.u || st.stock < 1 || (S.counter[i] || 0) >= 8) return;
      const busy = workers.some(o => o !== w && o.mode === 'pick' && o.station === i);
      const s = demandFor(i) * 10 + st.stock - (busy ? 12 : 0);
      if (s > score) { score = s; best = i; }
    });
    if (best >= 0) { w.station = best; w.mode = 'pick'; w.t = 0; }
    else w.t = 0.4;
  }
}

// Où pointe la flèche d'aide (position logique + hauteur en mètres)
function hintTarget() {
  if (S.served > 25 && idleT < 5) return null;
  for (const tile of TILES) {
    if (tile.visible() && S.money + (S.tile[tile.key] || 0) >= tile.cost()) return { x: tile.x, y: tile.y, h: 2.2 };
  }
  if (!S.cashier && S.cash > 0) return { x: CASH.x, y: CASH.y, h: 2.4 };
  if (player.carry.length) return { x: clamp(player.x, 70, 270), y: COUNTER.y + 14, h: 2.4 };
  let best = -1;
  S.st.forEach((st, i) => { if (st.u && st.stock >= 1 && (best < 0 || st.stock > S.st[best].stock)) best = i; });
  return best >= 0 ? { x: STATIONS[best].x, y: PICK_Y, h: 2.8 } : null;
}

// ---------------------------------------------------------------------------
// Rendu 3D
// ---------------------------------------------------------------------------
let cityShown = -1;
function applyCity() {
  const hue = CITIES[S.city % CITIES.length].hue;
  const sky = new THREE.Color().setHSL(hue / 360, 0.5, 0.07);
  scene.background = sky;
  scene.fog = new THREE.Fog(sky, 45, 110);
  hemi.color.setHSL(hue / 360, 0.45, 0.6);
  cityShown = S.city;
}

function render(dt) {
  if (cityShown !== S.city) applyCity();

  // Caméra qui suit le joueur en douceur
  const t = Math.tan(FOV / 2 * Math.PI / 180);
  const halfW = camD * t * camera.aspect, halfD = camD * t / Math.sin(TILT);
  const limX = Math.max(0, 11 - halfW), limZ = Math.max(0, 15 - halfD * 0.9);
  const tx = clamp(toX(player.x), -limX, limX), tz = clamp(toZ(player.y) + 2, -1 - limZ, -1 + limZ);
  const k = Math.min(1, dt * 4);
  camTarget.x += (tx - camTarget.x) * k; camTarget.z += (tz - camTarget.z) * k;
  camera.position.set(camTarget.x, camD * Math.sin(TILT), camTarget.z + camD * Math.cos(TILT));
  camera.lookAt(camTarget);

  // Lanternes qui vacillent
  lanterns.forEach((l, i) => { l.scale.y = 1 + 0.04 * Math.sin(time * 3 + i); });
  warmLights.forEach((l, i) => { l.intensity = 0.85 + 0.12 * Math.sin(time * 2.3 + i * 2); });

  // Stands
  S.st.forEach((st, i) => {
    const s = stalls[i];
    s.g.visible = s.pass.visible = st.u; s.crates.visible = !st.u;
    s.light.intensity = st.u ? 0.9 : 0;
    if (st.u) {
      s.pop = Math.min(1, s.pop + dt * 2.5);
      const e = s.pop < 1 ? 1 + Math.sin(s.pop * Math.PI) * 0.25 : 1;
      s.g.scale.setScalar(Math.max(0.01, s.pop < 0.4 ? s.pop / 0.4 : e));
      s.sign.position.y = 4.1 + Math.sin(time * 2 + i) * 0.08;
      s.glow.material = basic(st.stock < stMax(i) ? '#ff7a3d' : '#7a3a20');
      syncStack(s.stack, Array(st.stock).fill(i), 9);
    }
  });
  STATIONS.forEach((_, i) => syncStack(counterStacks[i], Array(Math.max(0, S.counter[i] || 0)).fill(i), 10));
  syncCoins();
  syncCashier();

  // Cases
  TILES.forEach(tile => {
    const vis = tile.visible();
    tile.g.visible = vis;
    if (!vis) return;
    const paid = S.tile[tile.key] || 0, cost = tile.cost();
    tile.fill.scale.y = Math.max(0.001, paid / cost);
    const afford = S.money + paid >= cost;
    tile.border.material.opacity = afford ? 0.75 + 0.25 * Math.sin(time * 6) : 0.4;
  });

  // Personnages
  poseActor(player, dt, false);
  syncStack(player.mesh.userData.hold, player.carry);
  workers.forEach(w => { poseActor(w, dt, false); syncStack(w.mesh.userData.hold, w.carry); });
  customers.forEach(c => poseActor(c, dt, false));
  if (cashier) poseActor(cashier, dt, true);

  // Flèche
  const h = hintTarget();
  arrow.visible = !!h;
  if (h) { arrow.position.set(toX(h.x), h.h + 0.3 + Math.abs(Math.sin(time * 4)) * 0.4, toZ(h.y)); arrow.rotation.y = time * 2; }

  // Ombres centrées sur la caméra
  moon.target.position.set(camTarget.x, 0, camTarget.z);
  moon.position.set(camTarget.x - 8, 24, camTarget.z + 12);

  renderer.render(scene, camera);
  updateLabels();
  drawFx();
}

function updateLabels() {
  S.st.forEach((st, i) => {
    const el = stLabels[i];
    el.hidden = !st.u;
    lockLabels[i].hidden = st.u || TILES[i - 1]?.visible();
    if (!st.u) { if (!lockLabels[i].hidden) place(lockLabels[i], STATIONS[i].x, 135, 2.2); return; }
    const txt = 'Nv ' + st.lv;
    if (el.firstChild.textContent !== txt) el.firstChild.textContent = txt;
    el.querySelector('s').style.width = (st.stock >= stMax(i) ? 100 : ((st.cookT || 0) / stCook(i)) * 100).toFixed(0) + '%';
    place(el, STATIONS[i].x, 135, 5.0);
  });
  TILES.forEach(tile => {
    const vis = tile.visible();
    tile.el.hidden = !vis;
    if (!vis) return;
    const cost = tile.cost(), paid = S.tile[tile.key] || 0;
    const txt = fmt(Math.ceil(cost - paid));
    if (tile.costEl.textContent !== txt) tile.costEl.textContent = txt;
    tile.el.classList.toggle('afford', S.money + paid >= cost);
    place(tile.el, tile.x, tile.y, 0.2);
  });
  const q = queued();
  orderLabels.forEach((el, k) => {
    const c = q[k];
    const ok = c && Math.abs(c.y - (QUEUE_Y + k * QUEUE_GAP)) < 4;
    el.hidden = !ok;
    if (!ok) return;
    const html = Object.keys(c.order).filter(i => c.order[i] > 0).map(i => `${STATIONS[i].emoji}×${c.order[i]}`).join(' ');
    if (!html) { el.hidden = true; return; }
    if (el.textContent !== html) el.textContent = html;
    place(el, c.x, c.y, 1.4, 26, 0, '0,-50%');
  });
  cashLabel.hidden = S.cashier || S.cash <= 0;
  if (!cashLabel.hidden) { cashLabel.textContent = fmt(S.cash); place(cashLabel, CASH.x, CASH.y, 2.2); }
  fullLabel.hidden = player.carry.length < capacity();
  if (!fullLabel.hidden) place(fullLabel, player.x, player.y, -0.1);
  floaters.forEach(f => {
    f.el.style.opacity = String(1 - Math.max(0, f.t - 0.6) / 0.5);
    place(f.el, f.x, f.y, f.h);
  });
}

function drawFx() {
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, viewW, viewH);
  coins.forEach(c => {
    if (c.t < 0) return;
    const e = c.t * c.t * (3 - 2 * c.t);
    const x = c.x + (c.tx - c.x) * e, y = c.y + (c.ty - c.y) * e - Math.sin(c.t * Math.PI) * 60;
    fctx.fillStyle = '#ffcc48'; fctx.beginPath(); fctx.arc(x, y, 7, 0, Math.PI * 2); fctx.fill();
    fctx.fillStyle = '#fff2a8'; fctx.beginPath(); fctx.arc(x - 2, y - 2, 2.5, 0, Math.PI * 2); fctx.fill();
  });
  if (joy.id !== null) {
    fctx.globalAlpha = 0.3; fctx.fillStyle = '#fff4e0';
    fctx.beginPath(); fctx.arc(joy.ox, joy.oy, 50, 0, Math.PI * 2); fctx.fill();
    fctx.globalAlpha = 0.7;
    const vx = joy.x - joy.ox, vy = joy.y - joy.oy, l = Math.hypot(vx, vy), k = l > 50 ? 50 / l : 1;
    fctx.beginPath(); fctx.arc(joy.ox + vx * k, joy.oy + vy * k, 22, 0, Math.PI * 2); fctx.fill();
    fctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------------
// Interface (HUD, améliorations, modales)
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const el = {
  money: $('money'), city: $('city'), mult: $('mult'), mute: $('mute'),
  upBtn: $('btn-upgrades'), prestige: $('btn-prestige'), sheet: $('sheet'), list: $('up-list'), stats: $('stats'),
  modal: $('modal'), mTitle: $('modal-title'), mText: $('modal-text'), mOk: $('modal-ok'), mCancel: $('modal-cancel'),
  toast: $('toast'),
};

let toastTimer = 0;
function toast(msg) {
  el.toast.textContent = msg; el.toast.hidden = false; el.toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.style.opacity = '0'; setTimeout(() => { el.toast.hidden = true; }, 300); }, 2200);
}

let modalOk = null;
function showModal({ title, text, ok = 'OK', cancel = null, onOk = null }) {
  el.mTitle.textContent = title; el.mText.textContent = text; el.mOk.textContent = ok;
  el.mCancel.hidden = !cancel; if (cancel) el.mCancel.textContent = cancel;
  modalOk = onOk; el.modal.hidden = false;
}
el.mOk.addEventListener('click', () => { initAudio(); el.modal.hidden = true; const f = modalOk; modalOk = null; f && f(); });
el.mCancel.addEventListener('click', () => { el.modal.hidden = true; modalOk = null; });

function actCost(act) {
  if (act === 'speed') return S.lv.speed >= MAX_SPEED_LV ? null : speedCost();
  if (act === 'cap') return S.lv.cap >= MAX_CAP_LV ? null : capCost();
  const i = +act.split(':')[1];
  return S.st[i].lv >= MAX_ST_LV ? null : stUpCost(i);
}
function row(icon, title, sub, act) {
  const cost = actCost(act);
  const btn = cost === null ? '<span class="maxed">MAX</span>'
    : `<button class="buy" data-act="${act}"${S.money < cost ? ' disabled' : ''}>💰 ${fmt(cost)}</button>`;
  return `<div class="up-row"><div class="up-ic">${icon}</div><div class="up-txt"><b>${title}</b><span>${sub}</span></div>${btn}</div>`;
}
function renderSheet() {
  const rows = [];
  S.st.forEach((st, i) => {
    if (!st.u) return;
    const d = STATIONS[i];
    rows.push(row(d.emoji, `${d.name} · Nv ${st.lv}`, `Vend ${fmt(stPrice(i))} · cuit en ${stCook(i).toFixed(2)} s · ${stMax(i)} max`, 'st:' + i));
  });
  rows.push(row('👟', `Baskets · Nv ${S.lv.speed}`, `Vitesse ${playerSpeed()}`, 'speed'));
  rows.push(row('🧺', `Plateau · Nv ${S.lv.cap}`, `Tu portes ${capacity()} plats`, 'cap'));
  el.list.innerHTML = rows.join('');
  el.stats.textContent = `${S.served} clients servis · ${S.vip} VIP · gains ×${S.mult}`;
}
function refreshSheetButtons() {
  el.list.querySelectorAll('.buy').forEach(b => { b.disabled = S.money < actCost(b.dataset.act); });
}
el.list.addEventListener('click', e => {
  const b = e.target.closest('.buy'); if (!b) return;
  const act = b.dataset.act, cost = actCost(act);
  if (cost === null || S.money < cost) return;
  S.money -= cost;
  if (act === 'speed') S.lv.speed++;
  else if (act === 'cap') S.lv.cap++;
  else S.st[+act.split(':')[1]].lv++;
  sfx.unlock(); buzz(20); renderSheet(); save();
});
el.upBtn.addEventListener('click', () => { initAudio(); renderSheet(); el.sheet.hidden = false; });
$('sheet-close').addEventListener('click', () => { el.sheet.hidden = true; });
el.mute.addEventListener('click', () => {
  muted = !muted; el.mute.textContent = muted ? '🔇' : '🔊';
  el.mute.setAttribute('aria-label', muted ? 'Activer le son' : 'Couper le son');
  try { localStorage.setItem(SAVE_KEY + '.mute', muted ? '1' : '0'); } catch (e) { /* ignore */ }
});

el.prestige.addEventListener('click', () => {
  const cost = prestigeCost(), next = cityName(S.city + 1);
  if (S.money < cost) {
    showModal({ title: `Direction ${next}`, text: `Il te faut ${fmt(cost)} pièces pour déménager. Tes gains y seront doublés pour toujours.` });
    return;
  }
  showModal({
    title: `Déménager à ${next} ?`,
    text: `Ça coûte ${fmt(cost)} pièces. Ton marché repart de zéro, mais tous tes gains passent à ×${S.mult * 2} pour toujours.`,
    ok: 'Déménager', cancel: 'Pas encore',
    onOk: () => {
      S = freshState({ city: S.city + 1, mult: S.mult * 2, served: S.served, vip: S.vip, seenIntro: true });
      customers.forEach(c => scene.remove(c.mesh)); workers.forEach(w => scene.remove(w.mesh));
      customers = []; workers = []; player.carry = []; player.x = 200; player.y = 280;
      stalls.forEach((s, i) => { s.pop = i === 0 ? 0 : 1; });
      sfx.unlock(); save(); toast(`Bienvenue à ${cityName(S.city)} !`);
    },
  });
});

let hudT = 0;
function updateHud(dt) {
  if (S.money !== lastMoney) { el.money.textContent = fmt(S.money); lastMoney = S.money; }
  el.city.textContent = cityName(S.city); el.mult.textContent = '×' + S.mult;
  el.prestige.hidden = !S.st.every(s => s.u);
  if (!el.sheet.hidden) { hudT -= dt; if (hudT <= 0) { refreshSheetButtons(); hudT = 0.25; } }
}

// ---------------------------------------------------------------------------
// Démarrage, gains hors ligne, boucle
// ---------------------------------------------------------------------------
function offlineEarnings() {
  if (!S.workers) return;
  const secs = Math.min((Date.now() - S.t) / 1000, 3 * 3600);
  if (secs < 60) return;
  let rate = 0;
  S.st.forEach((st, i) => { if (st.u) rate += stPrice(i) / stCook(i); });
  rate *= 0.35 * Math.min(1, S.workers / unlockedCount());
  const gain = Math.round(rate * secs);
  if (gain <= 0) return;
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60);
  showModal({
    title: 'Ton marché a tourné sans toi',
    text: `Pendant ${h ? h + ' h ' : ''}${m} min, tes vendeurs ont gagné ${fmt(gain)} pièces.`,
    ok: 'Récupérer', onOk: () => { S.money += gain; S.total += gain; sfx.coin(); save(); },
  });
}

let last = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000 || 0);
  last = ts;
  update(dt); render(dt); updateHud(dt);
  requestAnimationFrame(frame);
}

function start(data) {
  const loaded = load(data && data.S);
  for (let k = 0; k < S.workers; k++) spawnWorker();
  el.mute.textContent = muted ? '🔇' : '🔊';
  if (!S.seenIntro) {
    showModal({
      title: 'Bienvenue au Night Market',
      text: 'Glisse le doigt pour te déplacer. Ramasse les brochettes au stand, pose-les sur le comptoir, encaisse les pièces et agrandis ton marché.',
      ok: "C'est parti", onOk: () => { S.seenIntro = true; save(); },
    });
  } else if (loaded) offlineEarnings();
  setInterval(save, 4000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  requestAnimationFrame(frame);
}

const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ S }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
